<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="src/Logo_V3D.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Calculadora de Preços - V3D</title>
</head>

<body>
    <img src="src/Logo_V3D.png" alt="Loggo V3D" class="logo">

    <div class="content">
        <div class="block">
            <h1>Calculadora de Preços</h1>
            <div class="inputs">
                <div class="box-input">
                    <label for="time">Tempo de Impressão</label>
                    <input type="number" name="time" id="time">
                </div>
                <div class="box-input">
                    <label for="quantity">Qtd Filamento (g)</label>
                    <input type="number" name="quantity" id="quantity">
                </div>
                <div class="box-input">
                    <label for="price">Preço Filamento (R$/Kg)</label>
                    <input type="number" name="price" id="price">
                </div>
            </div>
        </div>

        <div class="block">
            <h1>Adicionais</h1>
            <div class="inputs style-2">
                <div class="box-input">
                    <label for="product">Produto</label>
                    <input type="text" name="product" id="product">
                </div>
                <div class="box-input">
                    <label for="price-add">Preço</label>
                    <input type="number" name="price-add" id="price-add">
                </div>
                <div class="box-input">
                    <label for="quantity-add">Quantidade</label>
                    <input type="number" name="quantity-add" id="quantity-add">
                </div>
                <div class="box-input">
                    <input type="button" name="add" id="add" value="Adicionar">
                </div>
            </div>
        </div>
        <table>
            <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Quantidade</th>
                <th class="action-column"></th>
            </tr>

            <tr>
                <td>Caixa</td>
                <td>R$ 20,90</td>
                <td>1</td>
                <td class="action-column">
                    <button class="delete-btn" type="button">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </td>
            </tr>
        </table>

        <div class="final">
            <div class="box-input">
                <label for="profit">Lucro (0-100%)</label>
                <input type="number" name="profit" id="profit">
            </div>

            <div>
                <h2>Total: <span>R$0,00</span></h2>
            </div>
        </div>
    </div>
</body>

</html>
